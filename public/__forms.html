<!doctype html>
<html>
  <!-- Netlify Forms reads this static file at deploy time to register the "inquiry" form.
       Field names must match src/components/Inquiry.tsx. Not linked from the site. -->
  <body>
    <form name="inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="inquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="brand" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="website" />
      <input type="checkbox" name="needs" />
      <textarea name="goals"></textarea>
      <input type="radio" name="budget" />
      <select name="timeline"><option></option></select>
    </form>
  </body>
</html>
